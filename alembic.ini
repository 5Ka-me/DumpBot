# Alembic config. The database URL is NOT stored here: migrations/env.py takes DATABASE_URL from the
# environment, then from .env, then falls back to the default in dumpbot.config.Settings.

[alembic]
script_location = %(here)s/migrations
# Migration file names: 20261006_1200_<rev>_<slug>.py (sortable by date)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os

[post_write_hooks]
# Format freshly generated revisions with ruff (dev dependency; only used by "alembic revision").
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
# Only import order / pyupgrade: keep "op" and "sa" imports in a fresh hand-written revision.
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --select I,UP --exit-zero --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
