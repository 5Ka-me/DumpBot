# Dump Bot: PostgreSQL + one-shot migrations + the bot (long polling, no inbound ports).
#   docker compose up -d --build      # build, migrate, start
#   docker compose logs -f bot        # logs
#   docker compose --profile whisper up -d --build   # + the optional local Whisper (LOCAL_STT_URL, README.md)
# Secrets and settings come from .env (copy .env.example). Postgres is reachable from the host only on 127.0.0.1.

name: dumpbot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: dumpbot:local
  env_file: .env
  environment:
    # Same .env works for local runs (127.0.0.1) and here (the db container).
    DATABASE_URL: postgresql+asyncpg://dump:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@db:5432/dump
    HEARTBEAT_FILE: /tmp/heartbeat
  logging: *logging

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: dump
      POSTGRES_DB: dump
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker: mount the parent.
      - pgdata:/var/lib/postgresql
    ports:
      # Loopback only (DBeaver, local dev). Never 0.0.0.0.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dump -d dump"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
    # Time for the shutdown checkpoint before SIGKILL (Docker Desktop may default to 1 s).
    stop_grace_period: 60s
    logging: *logging

  migrate:
    <<: *app
    # The image is built once, here; bot reuses it (two builders of one tag race each other).
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bot:
    <<: *app
    pull_policy: never  # local image built by the migrate service
    depends_on:
      db:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    # SIGTERM -> up to 10 s for updates being handled (DRAIN_TIMEOUT_S), job release, closing; then SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      # The scheduler rewrites the heartbeat file on every tick (<= SCHEDULER_INTERVAL_S); stale for
      # max(120 s, 4 intervals) = behind. Docker only marks the container unhealthy: the bot itself exits when a
      # loop crashes or stops making progress (watchdog), and "restart" brings it back.
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; p = os.environ.get('HEARTBEAT_FILE', '/tmp/heartbeat'); limit = max(120.0, 4 * float(os.environ.get('SCHEDULER_INTERVAL_S') or 30)); sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < limit else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Optional local speech-to-text (faster-whisper on the CPU), docs/features/iteration-2.md, B. Started only with
  # "--profile whisper"; the bot uses it when .env has LOCAL_STT_URL=http://whisper:9000. Not published on the host:
  # only the bot reaches it, over the compose network.
  whisper:
    profiles: ["whisper"]
    build:
      context: ./whisper
    image: dumpbot-whisper:local
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_THREADS: ${WHISPER_THREADS:-0}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-1}
      WHISPER_MAX_AUDIO_S: ${WHISPER_MAX_AUDIO_S:-120}
    volumes:
      # The model is downloaded here on the first request (once) and read from here afterwards, without network.
      - whisper-models:/models
    # small int8 needs about 1 GB while it works; medium needs WHISPER_MEM_LIMIT=4g.
    mem_limit: ${WHISPER_MEM_LIMIT:-2g}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *logging

volumes:
  pgdata:
  whisper-models:
