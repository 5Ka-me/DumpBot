[project]
name = "dumpbot"
version = "0.1.0"
description = "Personal Telegram dump bot: notes, ideas, tasks and reminders parsed by AI (chutes.ai)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.31,<4",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.15",
    "python-dateutil>=2.9.0.post0",
    "tzdata>=2026.5",
    "dateparser>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.13",
]

[project.scripts]
dumpbot = "dumpbot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dumpbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning:dateparser.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# Research notes hold illustrative snippets, not project code (ruff >= 0.16 also formats Markdown code blocks).
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text in strings/comments is intentional
